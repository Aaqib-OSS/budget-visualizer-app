version: 2
updates:
  # Every `uses:` is pinned to a commit SHA, so nothing moves unless this bumps it.
  # The composite action under .github/actions/ pins its own SHAs and is not covered by
  # the default `/` directory, hence the glob.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    # One PR per week, not one per action: `main` requires branches to be up to date, so
    # each extra PR is another serial rebase-and-rerun.
    groups:
      github-actions:
        patterns: ['*']

  # App dependencies from bun.lock. Minor and patch bumps share one weekly PR for the same
  # serial-rebase reason as above. Majors stay one PR per package, so a breaking bump can't
  # hold the routine ones hostage. Security updates are separate: Dependabot opens those as
  # soon as an advisory lands, ungrouped, because the group only applies to version updates.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    groups:
      bun-minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
    ignore:
      # The E2E job runs in mcr.microsoft.com/playwright:vX.Y.Z-noble, whose tag must equal
      # this exact version. Dependabot can't bump a workflow `container:` image, so a solo
      # package bump strands the tests without browsers. Bump both together by hand.
      - dependency-name: '@playwright/test'
      # 10.7.x's docgen emits `default.__docgenInfo = …` for `export default function`
      # components, a syntax error that breaks build-storybook. Pinned to 10.5.2 until fixed.
      - dependency-name: storybook-solidjs-vite
        versions: ['10.7.x']
      # TypeScript 7 is the native (Go) compiler and ships without the JS compiler API.
      # typescript-eslint and Storybook's docgen both read it (`ts.ModuleKind`,
      # `ts.JsxEmit`) and crash. Lift once both support TS 7.
      - dependency-name: typescript
        versions: ['>=7.0.0']
      # These types describe the Node runtime, which .nvmrc pins to 24. A newer major
      # types APIs that don't exist at runtime. Bump the major alongside .nvmrc.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
