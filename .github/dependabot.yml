version: 2
updates:
  # Every `uses:` is pinned to a commit SHA, so nothing moves unless this bumps it.
  # The composite action under .github/actions/ pins its own SHAs and is not covered by
  # the default `/` directory, hence the glob.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    # One PR per week, not one per action: `main` requires branches to be up to date, so
    # each extra PR is another serial rebase-and-rerun.
    groups:
      github-actions:
        patterns: ['*']

  # App dependencies from bun.lock. Minor and patch bumps share one weekly PR for the same
  # serial-rebase reason as above. Majors stay one PR per package, so a breaking bump can't
  # hold the routine ones hostage. Security updates are separate: Dependabot opens those as
  # soon as an advisory lands, ungrouped, because the group only applies to version updates.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    groups:
      bun-minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
